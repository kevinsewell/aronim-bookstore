services:

  # Keycloak
  keycloak:
    image: quay.io/keycloak/keycloak:26.1.3
    container_name: aronim-keycloak
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin@aronim.local}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-P@ssw0rd}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      KC_HEALTH_ENABLED: true
      KC_HTTP_ENABLED: true
      KC_HOSTNAME: identity.aronim.local
      KC_HOSTNAME_PORT: 8080
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_BACKCHANNEL: true
      KC_HOSTNAME_STRICT_HTTPS: false
      KC_LOG_LEVEL: INFO
      KC_METRICS_ENABLED: true
      KC_PROXY: passthrough
      KC_PROXY_ADDRESS_FORWARDING: true
    volumes:
      - ./certificates/cacerts:/opt/keycloak/conf/cacerts:ro
      - ./keycloak/healthcheck.sh:/tmp/healthcheck.sh:ro
      - ./keycloak/realm-config:/opt/keycloak/data/import
    command:
      - start
      - --import-realm
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "/bin/bash", "/tmp/healthcheck.sh", "9000" ]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - aronim-network
    restart: unless-stopped

  # Mailhog
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: aronim-mailhog
    ports:
      - "1025:1025" # SMTP server
      - "8025:8025" # Web UI
    networks:
      - aronim-network
    restart: unless-stopped

  # Nginx
  nginx:
    image: nginx:latest
    links:
      - keycloak:keycloak
    ports:
      - "443:443"
      - "80:80"
    depends_on:
      keycloak:
        condition: service_healthy
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certificates/wildcard.aronim.local.crt:/etc/nginx/wildcard.aronim.local.crt:ro
      - ./certificates/wildcard.aronim.local.key:/etc/nginx/wildcard.aronim.local.key:ro
    networks:
      aronim-network:
          aliases:
            - bookstore.aronim.local
    restart: unless-stopped

  # PostgreSQL
  postgres:
    image: postgres:17-alpine
    container_name: aronim-postgres
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_USER: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_MULTIPLE_DATABASES: keycloak, bookstore
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
      - ./postgresql/init-scripts:/docker-entrypoint-initdb.d
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aronim-network
    restart: unless-stopped

networks:
  aronim-network:
    driver: bridge

volumes:
  postgres_data:
