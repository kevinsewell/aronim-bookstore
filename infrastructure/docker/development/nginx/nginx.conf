user  nginx;

events {
}

http {
  include                               /etc/nginx/mime.types;

  server {
      listen                            80                                      default_server;
      server_name                       _;
      return                            301                                     https://$host$request_uri;
  }

  server {
    access_log                          /var/log/nginx/access.log;
    error_log                           /var/log/nginx/error.log;
    listen                              443                                     ssl;
    server_name                         ~^identity\.aronim\.local$;
    ssl_certificate                     wildcard.aronim.local.crt;
    ssl_certificate_key                 wildcard.aronim.local.key;

    location = / {
      return                            307                                     /admin/master/console/;
    }

    location ~* ^/(admin|js|realms|resources|robots.txt) {
      proxy_pass                        http://keycloak:8080;
      proxy_set_header                  Host                                    $host;
      proxy_set_header                  X-Forwarded-For                         $remote_addr;
      proxy_set_header                  X-Forwarded-Proto                       https;
      proxy_pass_request_headers        on;
    }

    location ~* ^/(health) {
      proxy_pass                        http://keycloak:9000;
      proxy_set_header                  Host                                    $host;
      proxy_set_header                  X-Forwarded-For                         $remote_addr;
      proxy_set_header                  X-Forwarded-Proto                       https;
      proxy_pass_request_headers        on;
    }
  }

  server {
    access_log                          /var/log/nginx/access.log;
    error_log                           /var/log/nginx/error.log;
    listen                              443                                     ssl;
    server_name                         ~^bookstore\.aronim\.local$;
    ssl_certificate                     wildcard.aronim.local.crt;
    ssl_certificate_key                 wildcard.aronim.local.key;

    location ~* ^(/) {
      proxy_pass                        http://host.docker.internal:8081;
      proxy_set_header                  Host                                    $host;
      proxy_set_header                  X-Forwarded-For                         $remote_addr;
      proxy_set_header                  X-Forwarded-Proto                       https;
      proxy_pass_request_headers        on;
    }
  }

  server {
    access_log                          /var/log/nginx/access.log;
    error_log                           /var/log/nginx/error.log;
    listen                              443                                     ssl;
    server_name                         ~^api\.bookstore\.aronim\.local$;
    ssl_certificate                     wildcard.bookstore.aronim.local.crt;
    ssl_certificate_key                 wildcard.bookstore.aronim.local.key;

    location ~* ^(/) {
      proxy_pass                        http://host.docker.internal:8082;
      proxy_set_header                  Host                                    $host;
      proxy_set_header                  X-Forwarded-For                         $remote_addr;
      proxy_set_header                  X-Forwarded-Proto                       https;
      proxy_pass_request_headers        on;
    }
  }
}
