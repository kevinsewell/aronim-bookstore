aronim:
  openapi:
    dev-url: http://localhost:8080
    prod-url: https://api.aronim.com
logging:
  level:
    com.aronim.bookstore: DEBUG
server:
  port: 8080
spring:
  datasource:
    driver-class-name: org.h2.Driver
    password: password
    url: jdbc:h2:mem:bookstoredb
    username: sa
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    out-of-order: false
    validate-on-migrate: true
    placeholder-replacement: true
    placeholders:
      table_suffix: ${ENVIRONMENT:dev}
    schemas: public
    default-schema: public
    connect-retries: 3
    sql-migration-prefix: V
    repeatable-sql-migration-prefix: R
    sql-migration-separator: __
    sql-migration-suffixes: .sql
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  security:
    user:
      name: admin@localhost.local
      password: changeme
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
  show-actuator: true
  packages-to-scan: com.aronim.bookstore.presentation.controller
