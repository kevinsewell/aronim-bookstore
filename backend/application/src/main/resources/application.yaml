aronim:
  openapi:
    dev-url: https://api.bookstore.aronim.local
    prod-url: https://api.bookstore.aronim.com
logging:
  level:
    com.aronim.bookstore: DEBUG
server:
  port: 8082
spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    password: ${POSTGRES_KEYCLOAK_PASSWORD}
    url: ${POSTGRES_KEYCLOAK_URL}
    username: ${POSTGRES_KEYCLOAK_USERNAME}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    out-of-order: false
    validate-on-migrate: true
    placeholder-replacement: true
    placeholders:
      table_suffix: ${ENVIRONMENT:dev}
    schemas: public
    default-schema: public
    connect-retries: 3
    sql-migration-prefix: V
    repeatable-sql-migration-prefix: R
    sql-migration-separator: __
    sql-migration-suffixes: .sql
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: ${KEYCLOAK_BOOKSTORE_BACKEND_CLIENT_ID}
            client-secret: ${KEYCLOAK_BOOKSTORE_BACKEND_CLIENT_SECRET}
            scope: openid,profile,email
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_BOOKSTORE_REALM_URL}
            user-name-attribute: preferred_username
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_BOOKSTORE_REALM_URL}
          jwk-set-uri: ${KEYCLOAK_BOOKSTORE_REALM_URL}/protocol/openid-connect/certs
springdoc:
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: v1
      paths-to-match: /api/v1/**
  packages-to-scan: com.aronim.bookstore.catalog.api.controller
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    groups-order: DESC
    operationsSorter: method
    disable-swagger-default-url: true
  show-actuator: false
