name: Acceptance Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - "backend/**"
      - "frontend/**"
      - "infrastructure/**"
      - "tests/acceptance/**"
  pull_request:
    branches: [ main, develop ]
    paths:
      - "backend/**"
      - "frontend/**"
      - "infrastructure/**"
      - "tests/acceptance/**"
  workflow_dispatch: {}

jobs:
  acceptance-tests:
    name: Run Acceptance Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [ 18.x ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v1

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Generate CA Certificate
        env:
          CERTIFICATES_ARONIM_LOCAL_ROOT_CA: ${{secrets.CERTIFICATES_ARONIM_LOCAL_ROOT_CA}}
        run: echo ${CERTIFICATES_ARONIM_LOCAL_ROOT_CA} | base64 --decode > infrastructure/helm/aronim-bookstore/configmap/certificates-config/ca-certificates/aronim-local-root-ca.crt

      - name: Build Docker image
        run: ./gradlew bootBuildImage

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.6.2
          run_install: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
          cache-dependency-path: "frontend/pnpm-lock.yaml"

      - name: Install dependencies
        run: pnpm install
        working-directory: ./frontend

      - name: Install dependencies
        run: pnpm run build:development
        working-directory: ./frontend

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          tags: aronim-bookstore-frontend-application:0.0.2

      - name: Kubernetes KinD Cluster
        id: kind
        uses: helm/kind-action@v1
        with:
          config: infrastructure/kind/kind-config.yaml
          cluster_name: kind

      - name: Load Backend Docker iamge into KinD
        run: kind load docker-image aronim-bookstore-backend-application:0.0.1-SNAPSHOT --name kind

      - name: Load Frontend Docker iamge into KinD
        run: kind load docker-image aronim-bookstore-frontend-application:0.0.2 --name kind
